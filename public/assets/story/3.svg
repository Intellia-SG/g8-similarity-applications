<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <pattern id="labGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(167, 139, 250, 0.08)" stroke-width="1" />
    </pattern>
    <filter id="photoGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Studio Lab Background -->
  <rect width="800" height="600" fill="url(#labBg)" />
  <rect width="800" height="600" fill="url(#labGrid)" />

  <!-- Studio Ambient Lighting / Lamps -->
  <circle cx="200" cy="50" r="120" fill="rgba(245, 158, 11, 0.12)" />
  <circle cx="650" cy="80" r="140" fill="rgba(56, 189, 248, 0.12)" />

  <!-- Main Blueprint Drafting Table Surface -->
  <path d="M 0 460 L 800 460 L 800 600 L 0 600 Z" fill="#090d16" />
  <line x1="0" y1="460" x2="800" y2="460" stroke="#a78bfa" stroke-width="2" />

  <!-- Wall Board / Screen in Background: Tree Result -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="280" height="130" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="140" y="32" fill="#38bdf8" font-family="'Nunito', sans-serif" font-size="14" font-weight="900" text-anchor="middle">
      🌲 TREE SURVEY VERIFIED
    </text>
    <line x1="20" y1="44" x2="260" y2="44" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="140" y="75" fill="#f8fafc" font-family="'Nunito', sans-serif" font-size="14" font-weight="800" text-anchor="middle">
      Pole: 2 m · Scale: <tspan fill="#f59e0b">k = 4×</tspan>
    </text>
    <text x="140" y="105" fill="#4ade80" font-family="'Nunito', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
      Tree Height = 8 m ✓
    </text>
  </g>

  <!-- Large Aerial Photo Enlargement Display (Center/Right) -->
  <g transform="translate(420, 80)">
    <!-- Big Enlarged Photo (15 cm x 10 cm) -->
    <rect x="0" y="0" width="320" height="220" rx="14" fill="#042f2e" stroke="#10b981" stroke-width="3" filter="url(#photoGlow)" />
    <!-- Terrain / Mountain in aerial photo -->
    <polygon points="40,180 140,70 240,180" fill="#065f46" opacity="0.8" />
    <polygon points="160,180 230,100 300,180" fill="#047857" opacity="0.9" />
    <circle cx="270" cy="50" r="22" fill="#fef08a" opacity="0.8" />
    <!-- Photo Dimensions Label -->
    <rect x="70" y="188" width="180" height="26" rx="6" fill="rgba(15,23,42,0.9)" stroke="#10b981" stroke-width="1.5" />
    <text x="160" y="206" fill="#6ee7b7" font-family="'Nunito', sans-serif" font-size="13" font-weight="900" text-anchor="middle">
      Enlarged: 15 cm × 10 cm
    </text>
  </g>

  <!-- Small Original Photo (6 cm x 4 cm) -->
  <g transform="translate(240, 240)">
    <rect x="0" y="0" width="128" height="88" rx="8" fill="#064e3b" stroke="#f59e0b" stroke-width="2.5" />
    <polygon points="15,70 55,30 95,70" fill="#047857" />
    <text x="64" y="80" fill="#fde68a" font-family="'Nunito', sans-serif" font-size="10" font-weight="900" text-anchor="middle">
      Original: 6 × 4 cm
    </text>
  </g>

  <!-- Golden Multiplier Arrow connecting Small to Large (k = 2.5) -->
  <g transform="translate(350, 210)">
    <path d="M 20 60 Q 60 20 100 30" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-dasharray="5 3" />
    <polygon points="100,30 88,22 92,38" fill="#f59e0b" />
    <rect x="35" y="-5" width="90" height="30" rx="8" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" />
    <text x="80" y="15" fill="#fef08a" font-family="'Nunito', sans-serif" font-size="13" font-weight="900" text-anchor="middle">
      k = 2.5×
    </text>
  </g>

  <!-- Characters in the Lab -->
  <!-- Maya with Surveyor Theodolite / Ruler -->
  <g transform="translate(100, 350)">
    <circle cx="25" cy="20" r="16" fill="#fed7aa" />
    <path d="M 11 18 Q 25 6 39 18 Q 41 2 25 2 Q 9 2 11 18" fill="#78350f" />
    <rect x="12" y="36" width="26" height="42" rx="4" fill="#0284c7" />
    <!-- Holding Long Ruler -->
    <rect x="38" y="20" width="6" height="60" fill="#f59e0b" rx="2" />
    <!-- Legs -->
    <line x1="18" y1="78" x2="18" y2="105" stroke="#1e293b" stroke-width="4" />
    <line x1="32" y1="78" x2="32" y2="105" stroke="#1e293b" stroke-width="4" />
    <text x="25" y="125" fill="#bae6fd" font-family="'Nunito', sans-serif" font-size="12" font-weight="900" text-anchor="middle">Maya</text>
  </g>

  <!-- Leo pointing at blueprint -->
  <g transform="translate(190, 360)">
    <circle cx="22" cy="20" r="16" fill="#fed7aa" />
    <path d="M 8 16 Q 22 4 36 16" fill="#b45309" stroke="#b45309" stroke-width="7" stroke-linecap="round" />
    <rect x="9" y="36" width="26" height="42" rx="4" fill="#ea580c" />
    <line x1="15" y1="78" x2="15" y2="105" stroke="#1e293b" stroke-width="4" />
    <line x1="29" y1="78" x2="29" y2="105" stroke="#1e293b" stroke-width="4" />
    <text x="22" y="125" fill="#fed7aa" font-family="'Nunito', sans-serif" font-size="12" font-weight="900" text-anchor="middle">Leo</text>
  </g>

  <!-- Echo the Bat holding magnifying glass -->
  <g transform="translate(370, 360)">
    <circle cx="18" cy="18" r="13" fill="#6d28d9" />
    <path d="M 6 18 Q -10 4 0 28 Q 6 22 6 18 Z" fill="#8b5cf6" />
    <path d="M 30 18 Q 46 4 36 28 Q 30 22 30 18 Z" fill="#8b5cf6" />
    <circle cx="14" cy="15" r="2.5" fill="#fef08a" />
    <circle cx="22" cy="15" r="2.5" fill="#fef08a" />
    <!-- Magnifying Glass -->
    <circle cx="34" cy="10" r="10" fill="none" stroke="#fbbf24" stroke-width="2" />
    <line x1="41" y1="17" x2="52" y2="28" stroke="#f59e0b" stroke-width="3" />
  </g>

  <!-- Formula Card at bottom -->
  <g transform="translate(140, 500)">
    <rect x="0" y="0" width="520" height="70" rx="14" fill="rgba(15, 23, 42, 0.95)" stroke="#fbbf24" stroke-width="2" />
    <text x="260" y="28" fill="#fbbf24" font-family="'Nunito', sans-serif" font-size="15" font-weight="900" text-anchor="middle">
      MAYA'S 3-STEP SURVEY RULE
    </text>
    <text x="260" y="52" fill="#f8fafc" font-family="'Nunito', sans-serif" font-size="13" font-weight="800" text-anchor="middle">
      1. Match sides  →  2. Find <tspan fill="#f59e0b">k = 15 ÷ 6 = 2.5</tspan>  →  3. Multiply: <tspan fill="#4ade80">4 × 2.5 = 10 cm</tspan>
    </text>
  </g>
</svg>
