<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="35%" stop-color="#6b21a8" />
      <stop offset="70%" stop-color="#be185d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="goldSealGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sunset Mountain Sky -->
  <rect width="800" height="600" fill="url(#sunsetSky)" />

  <!-- Mountain Silhouette Range -->
  <polygon points="0,480 180,260 360,480" fill="#1e1b4b" opacity="0.8" />
  <polygon points="260,480 480,200 700,480" fill="#0f172a" opacity="0.9" />
  <polygon points="520,480 720,280 800,480" fill="#1e1b4b" opacity="0.8" />

  <!-- Summit Cliff Overlook (Foreground) -->
  <path d="M 0 460 Q 300 430 800 460 L 800 600 L 0 600 Z" fill="#090d16" />
  <line x1="0" y1="460" x2="800" y2="460" stroke="#f59e0b" stroke-width="2.5" />

  <!-- Confetti / Sparkles -->
  <circle cx="140" cy="120" r="3" fill="#fef08a" filter="url(#starGlow)" />
  <circle cx="280" cy="90" r="4" fill="#a855f7" filter="url(#starGlow)" />
  <circle cx="440" cy="110" r="3.5" fill="#38bdf8" filter="url(#starGlow)" />
  <circle cx="620" cy="130" r="4" fill="#4ade80" filter="url(#starGlow)" />
  <circle cx="720" cy="90" r="3" fill="#fbbf24" filter="url(#starGlow)" />

  <!-- Golden Surveyor's Seal (Center Badge) -->
  <g transform="translate(400, 210)">
    <!-- Outer Star Sunburst -->
    <circle cx="0" cy="0" r="88" fill="url(#goldSealGrad)" filter="url(#starGlow)" />
    <circle cx="0" cy="0" r="76" fill="#1e1b4b" stroke="#fef08a" stroke-width="3" />
    <!-- Geometric Triangles inside Badge -->
    <polygon points="0,-45 40,30 -40,30" fill="none" stroke="#f59e0b" stroke-width="3" />
    <polygon points="0,-22 20,15 -20,15" fill="none" stroke="#38bdf8" stroke-width="2" />
    <!-- Center Star -->
    <circle cx="0" cy="-3" r="6" fill="#fef08a" />
    <!-- Badge Ribbon -->
    <path d="M -50 70 L -30 40 L 30 40 L 50 70 L 0 55 Z" fill="#dc2626" stroke="#fef08a" stroke-width="1.5" />
    <text x="0" y="58" fill="#ffffff" font-family="'Nunito', sans-serif" font-size="11" font-weight="900" text-anchor="middle">LEVEL 8 CERTIFIED</text>
  </g>

  <!-- Characters on Summit -->
  <!-- Maya raising Sextant / Angle finder -->
  <g transform="translate(180, 370)">
    <!-- Body -->
    <rect x="12" y="30" width="22" height="38" rx="4" fill="#0284c7" />
    <!-- Head -->
    <circle cx="23" cy="16" r="14" fill="#fed7aa" />
    <path d="M 11 14 Q 23 4 35 14 Q 37 0 23 0 Q 9 0 11 14" fill="#78350f" />
    <!-- Raised Hand with Sextant -->
    <line x1="28" y1="36" x2="44" y2="10" stroke="#fed7aa" stroke-width="4" stroke-linecap="round" />
    <circle cx="46" cy="8" r="8" fill="#f59e0b" stroke="#fef08a" stroke-width="2" />
    <!-- Legs -->
    <line x1="17" y1="68" x2="17" y2="82" stroke="#1e293b" stroke-width="4" />
    <line x1="29" y1="68" x2="29" y2="82" stroke="#1e293b" stroke-width="4" />
    <text x="23" y="100" fill="#bae6fd" font-family="'Nunito', sans-serif" font-size="12" font-weight="900" text-anchor="middle">Maya</text>
  </g>

  <!-- Leo holding blueprint roll with high-five pose -->
  <g transform="translate(250, 375)">
    <!-- Body -->
    <rect x="10" y="30" width="22" height="38" rx="4" fill="#ea580c" />
    <!-- Head -->
    <circle cx="21" cy="16" r="14" fill="#fed7aa" />
    <path d="M 9 12 Q 21 2 33 12" fill="#b45309" stroke="#b45309" stroke-width="6" stroke-linecap="round" />
    <!-- Arm holding blueprint roll -->
    <rect x="-8" y="28" width="14" height="26" rx="2" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
    <!-- Legs -->
    <line x1="15" y1="68" x2="15" y2="82" stroke="#1e293b" stroke-width="4" />
    <line x1="27" y1="68" x2="27" y2="82" stroke="#1e293b" stroke-width="4" />
    <text x="21" y="100" fill="#fed7aa" font-family="'Nunito', sans-serif" font-size="12" font-weight="900" text-anchor="middle">Leo</text>
  </g>

  <!-- Echo the Bat wearing tiny graduation / surveyor cap -->
  <g transform="translate(325, 300)">
    <circle cx="16" cy="16" r="11" fill="#6d28d9" />
    <polygon points="6,6 26,6 16,-2" fill="#f59e0b" /> <!-- tiny golden cap -->
    <path d="M 5 16 Q -12 2 0 26 Q 5 18 5 16 Z" fill="#8b5cf6" />
    <path d="M 27 16 Q 44 2 32 26 Q 27 18 27 16 Z" fill="#8b5cf6" />
    <circle cx="13" cy="14" r="2" fill="#fef08a" />
    <circle cx="19" cy="14" r="2" fill="#fef08a" />
  </g>

  <!-- Golden Law of Similarity Banner -->
  <g transform="translate(120, 505)">
    <rect x="0" y="0" width="560" height="68" rx="14" fill="rgba(15, 23, 42, 0.95)" stroke="#fbbf24" stroke-width="2" />
    <text x="280" y="28" fill="#fbbf24" font-family="'Nunito', sans-serif" font-size="15" font-weight="900" text-anchor="middle">
      ⭐ THE GOLDEN AXIOM OF SIMILARITY
    </text>
    <text x="280" y="52" fill="#f8fafc" font-family="'Nunito', sans-serif" font-size="14" font-weight="800" text-anchor="middle">
      <tspan fill="#38bdf8">Corresponding Angles: Congruent (=)</tspan>  ·  <tspan fill="#4ade80">Corresponding Sides: Proportional (× k)</tspan>
    </text>
  </g>
</svg>
