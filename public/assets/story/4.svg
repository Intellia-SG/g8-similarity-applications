  <rect x="40" y="40" width="1296" height="688" rx="24" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
  <text x="688" y="320" font-family="sans-serif" font-size="72" font-weight="900" fill="#fde047" text-anchor="middle">🪞 The Cliff and the Mirror</text>
  <text x="688" y="420" font-family="sans-serif" font-size="32" font-weight="600" fill="#e2e8f0" text-anchor="middle">Maya viewing the cliff crest reflection: mirror 15 m from cliff, eye height 1.6 m, 2 m back.</text>
  <text x="688" y="480" font-family="sans-serif" font-size="28" font-weight="700" fill="#4ade80" text-anchor="middle">k = 15 ÷ 2 = 7.5; Cliff Height = 1.6 × 7.5 = 12 m tall!</text>
