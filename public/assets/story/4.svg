<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="canyonSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#312e81" />
      <stop offset="80%" stop-color="#431407" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="cliffRock" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="50%" stop-color="#44403c" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <filter id="mirrorLaser">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#canyonSky)" />

  <!-- Ground Plane (Canyon Floor) -->
  <path d="M 0 460 L 800 460 L 800 600 L 0 600 Z" fill="#0c0a09" />
  <line x1="0" y1="460" x2="800" y2="460" stroke="#f59e0b" stroke-width="2.5" />

  <!-- Towering Vertical Cliff on Right -->
  <polygon points="580,460 580,60 800,40 800,460" fill="url(#cliffRock)" />
  <!-- Strata rock lines -->
  <line x1="580" y1="140" x2="800" y2="120" stroke="#57534e" stroke-width="2" />
  <line x1="580" y1="230" x2="800" y2="210" stroke="#57534e" stroke-width="2" />
  <line x1="580" y1="330" x2="800" y2="310" stroke="#57534e" stroke-width="2" />

  <!-- Cliff Crest Marker (Point C) -->
  <circle cx="580" cy="60" r="10" fill="#ef4444" filter="url(#mirrorLaser)" />
  <rect x="595" y="45" width="160" height="32" rx="8" fill="rgba(15,23,42,0.9)" stroke="#ef4444" stroke-width="1.5" />
  <text x="675" y="66" fill="#fca5a5" font-family="'Nunito', sans-serif" font-size="14" font-weight="900" text-anchor="middle">
    Cliff Crest = 12 m
  </text>

  <!-- Flat Mirror on Ground (Point M) -->
  <g transform="translate(380, 460)">
    <!-- Mirror Glass Surface -->
    <rect x="-35" y="-5" width="70" height="10" rx="3" fill="#38bdf8" stroke="#ffffff" stroke-width="2" filter="url(#mirrorLaser)" />
    <!-- Normal Dashed Line (Vertical) -->
    <line x1="0" y1="-5" x2="0" y2="-90" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="4 4" />
    <text x="0" y="25" fill="#38bdf8" font-family="'Nunito', sans-serif" font-size="13" font-weight="900" text-anchor="middle">
      Flat Mirror
    </text>
  </g>

  <!-- Maya on Left standing 2 m back -->
  <g transform="translate(180, 360)">
    <!-- Eye Level Marker (1.6 m) -->
    <circle cx="20" cy="18" r="15" fill="#fed7aa" />
    <circle cx="27" cy="18" r="4" fill="#38bdf8" filter="url(#mirrorLaser)" /> <!-- glowing eye looking at mirror -->
    <path d="M 6 16 Q 20 4 34 16 Q 36 0 20 0 Q 4 0 6 16" fill="#78350f" />
    <rect x="7" y="34" width="26" height="40" rx="4" fill="#0284c7" />
    <line x1="13" y1="74" x2="13" y2="100" stroke="#1e293b" stroke-width="4" />
    <line x1="27" y1="74" x2="27" y2="100" stroke="#1e293b" stroke-width="4" />
    <!-- Eye height label -->
    <rect x="-85" y="16" width="75" height="24" rx="6" fill="rgba(15,23,42,0.9)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="-48" y="32" fill="#7dd3fc" font-family="'Nunito', sans-serif" font-size="11" font-weight="900" text-anchor="middle">
      Eye = 1.6 m
    </text>
  </g>

  <!-- Laser Light Reflection Rays -->
  <!-- Ray from Cliff Crest (580, 60) to Mirror (380, 460) -->
  <line x1="580" y1="60" x2="380" y2="455" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6 3" filter="url(#mirrorLaser)" />
  <!-- Ray from Mirror (380, 455) to Maya's Eye (207, 378) -->
  <line x1="380" y1="455" x2="207" y2="378" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6 3" filter="url(#mirrorLaser)" />

  <!-- Equal Angles of Incidence & Reflection Arcs -->
  <path d="M 380 430 A 25 25 0 0 1 396 438" fill="none" stroke="#22c55e" stroke-width="3" />
  <path d="M 380 430 A 25 25 0 0 0 364 438" fill="none" stroke="#22c55e" stroke-width="3" />
  <text x="350" y="425" fill="#4ade80" font-family="'Nunito', sans-serif" font-size="13" font-weight="900">θ</text>
  <text x="402" y="425" fill="#4ade80" font-family="'Nunito', sans-serif" font-size="13" font-weight="900">θ</text>

  <!-- Ground Distances Labels -->
  <!-- Distance Mirror to Cliff: 15 m -->
  <line x1="380" y1="480" x2="580" y2="480" stroke="#f59e0b" stroke-width="2" marker-start="none" />
  <rect x="440" y="490" width="80" height="24" rx="6" fill="#78350f" stroke="#fbbf24" stroke-width="1" />
  <text x="480" y="506" fill="#fef08a" font-family="'Nunito', sans-serif" font-size="12" font-weight="900" text-anchor="middle">
    15 m
  </text>

  <!-- Distance Maya to Mirror: 2 m -->
  <line x1="200" y1="480" x2="380" y2="480" stroke="#38bdf8" stroke-width="2" />
  <rect x="255" y="490" width="70" height="24" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1" />
  <text x="290" y="506" fill="#bae6fd" font-family="'Nunito', sans-serif" font-size="12" font-weight="900" text-anchor="middle">
    2 m
  </text>

  <!-- Cliff Height Calculation Summary Card -->
  <g transform="translate(100, 535)">
    <rect x="0" y="0" width="600" height="52" rx="12" fill="rgba(15, 23, 42, 0.95)" stroke="#fbbf24" stroke-width="2" />
    <text x="300" y="24" fill="#fbbf24" font-family="'Nunito', sans-serif" font-size="14" font-weight="900" text-anchor="middle">
      Light Law: Angles Equal  →  Scale: <tspan fill="#38bdf8">k = 15 m ÷ 2 m = 7.5</tspan>
    </text>
    <text x="300" y="44" fill="#4ade80" font-family="'Nunito', sans-serif" font-size="15" font-weight="900" text-anchor="middle">
      Cliff Height = 1.6 m × <tspan fill="#fbbf24">7.5</tspan> = <tspan fill="#22c55e">12 m</tspan>  (Solved without climbing the cliff!)
    </text>
  </g>
</svg>
