<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <pattern id="blueprintGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />
    </pattern>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Blueprint Background with Grid -->
  <rect width="800" height="600" fill="url(#bg2)" />
  <rect width="800" height="600" fill="url(#blueprintGrid)" />

  <!-- Blueprint Header Title Badge -->
  <rect x="220" y="24" width="360" height="44" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="400" y="52" fill="#38bdf8" font-family="'Nunito', sans-serif" font-size="18" font-weight="900" text-anchor="middle">
    📐 SIMILARITY BLUEPRINT · THEOREM 1
  </text>

  <!-- Large Right Triangle (Tree Triangle) -->
  <!-- Base: 360 px (represents 12 m shadow), Height: 240 px (represents 8 m tree) -->
  <!-- Origin at (360, 480) -->
  <polygon
    points="360,480 720,480 720,240"
    fill="rgba(14, 165, 233, 0.15)"
    stroke="#0ea5e9"
    stroke-width="3"
    stroke-dasharray="none"
  />
  <!-- Right Angle Symbol -->
  <path d="M 696 480 L 696 456 L 720 456" fill="none" stroke="#38bdf8" stroke-width="2" />
  <!-- Angle theta arc at bottom left -->
  <path d="M 410 480 A 50 50 0 0 0 402 452" fill="none" stroke="#f59e0b" stroke-width="3" />
  <text x="424" y="468" fill="#fbbf24" font-family="'Nunito', sans-serif" font-size="14" font-weight="900">θ = 33.7°</text>

  <!-- Tree Triangle Labels -->
  <!-- Base 12 m -->
  <text x="540" y="515" fill="#38bdf8" font-family="'Nunito', sans-serif" font-size="16" font-weight="900" text-anchor="middle">Shadow = 12 m</text>
  <!-- Height 8 m -->
  <text x="740" y="360" fill="#4ade80" font-family="'Nunito', sans-serif" font-size="16" font-weight="900" text-anchor="start">Tree = 8 m</text>
  <!-- Hypotenuse label -->
  <text x="500" y="330" fill="#94a3b8" font-family="'Nunito', sans-serif" font-size="14" font-weight="700" transform="rotate(-33.7, 500, 330)">Sun Ray Hypotenuse</text>

  <!-- Small Right Triangle (Pole Triangle) -->
  <!-- Base: 90 px (represents 3 m shadow), Height: 60 px (represents 2 m pole) -->
  <g transform="translate(100, 300)">
    <polygon
      points="0,180 90,180 90,120"
      fill="rgba(245, 158, 11, 0.22)"
      stroke="#f59e0b"
      stroke-width="3"
    />
    <!-- Right Angle Symbol -->
    <path d="M 76 180 L 76 166 L 90 166" fill="none" stroke="#f59e0b" stroke-width="2" />
    <!-- Angle theta arc -->
    <path d="M 32 180 A 32 32 0 0 0 27 162" fill="none" stroke="#f59e0b" stroke-width="2.5" />
    <text x="36" y="174" fill="#fbbf24" font-family="'Nunito', sans-serif" font-size="12" font-weight="800">θ</text>

    <!-- Small triangle labels -->
    <text x="45" y="206" fill="#fbbf24" font-family="'Nunito', sans-serif" font-size="14" font-weight="800" text-anchor="middle">3 m</text>
    <text x="104" y="155" fill="#f59e0b" font-family="'Nunito', sans-serif" font-size="14" font-weight="800" text-anchor="start">2 m</text>
    <text x="45" y="100" fill="#fde68a" font-family="'Nunito', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Survey Pole</text>
  </g>

  <!-- Multiplier Beam connecting Small to Large (k = 4) -->
  <g transform="translate(190, 260)">
    <!-- Glowing Curved Arrow -->
    <path d="M 10 120 Q 80 40 180 80" fill="none" stroke="#a855f7" stroke-width="4" stroke-dasharray="6 4" filter="url(#neonGlow)" />
    <polygon points="180,80 168,70 174,86" fill="#a855f7" />

    <!-- Scale Factor Badge -->
    <rect x="55" y="25" width="130" height="42" rx="10" fill="#3b0764" stroke="#c084fc" stroke-width="2" />
    <text x="120" y="52" fill="#f5d0fe" font-family="'Nunito', sans-serif" font-size="16" font-weight="900" text-anchor="middle">Scale: k = 4×</text>
  </g>

  <!-- Formula Summary Card at the bottom -->
  <g transform="translate(80, 500)">
    <rect x="0" y="0" width="640" height="74" rx="14" fill="rgba(15, 23, 42, 0.95)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="320" y="30" fill="#f8fafc" font-family="'Nunito', sans-serif" font-size="15" font-weight="900" text-anchor="middle">
      Shadow Ratio = 12 m ÷ 3 m = <tspan fill="#f59e0b">4</tspan>
    </text>
    <text x="320" y="55" fill="#4ade80" font-family="'Nunito', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
      Height = 2 m × <tspan fill="#f59e0b">4</tspan> = <tspan fill="#22c55e">8 m</tspan>  (Angles stay identical; every side multiplies!)
    </text>
  </g>
</svg>
