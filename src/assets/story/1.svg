<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="grass1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky1)" />

  <!-- Stars -->
  <circle cx="120" cy="80" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="260" cy="50" r="2" fill="#ffffff" opacity="0.9" />
  <circle cx="420" cy="90" r="1.5" fill="#ffffff" opacity="0.7" />
  <circle cx="680" cy="70" r="2" fill="#ffffff" opacity="0.8" />

  <!-- Sun with Radiant Rays -->
  <circle cx="700" cy="110" r="80" fill="url(#sunGlow)" />
  <circle cx="700" cy="110" r="32" fill="#fef08a" filter="url(#glow)" />
  
  <!-- Sun Rays projecting down -->
  <line x1="700" y1="110" x2="60" y2="480" stroke="rgba(254, 240, 138, 0.22)" stroke-width="2" stroke-dasharray="6 4" />
  <line x1="700" y1="110" x2="340" y2="480" stroke="rgba(254, 240, 138, 0.25)" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Rolling Meadow / Ground -->
  <path d="M 0 460 Q 300 440 800 460 L 800 600 L 0 600 Z" fill="url(#grass1)" />
  <line x1="0" y1="460" x2="800" y2="460" stroke="#4ade80" stroke-width="3" opacity="0.6" />

  <!-- Giant Tree Shadow (12 m) -->
  <polygon points="460,460 70,475 70,488 460,470" fill="#022c22" opacity="0.75" />
  <!-- Shadow label -->
  <rect x="180" y="495" width="160" height="30" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="260" y="515" fill="#38bdf8" font-family="'Nunito', sans-serif" font-size="14" font-weight="900" text-anchor="middle">Tree Shadow = 12 m</text>

  <!-- Giant Ancient Oak Tree -->
  <g transform="translate(460, 160)">
    <!-- Tree Trunk -->
    <path d="M 10 300 Q 15 180 30 100 Q 50 180 55 300 Z" fill="#78350f" />
    <!-- Trunk Bark lines -->
    <path d="M 22 280 Q 28 200 32 120" stroke="#451a03" stroke-width="3" fill="none" />
    <!-- Foliage Layers -->
    <circle cx="35" cy="80" r="110" fill="#14532d" />
    <circle cx="-15" cy="90" r="85" fill="#15803d" />
    <circle cx="75" cy="85" r="90" fill="#166534" />
    <circle cx="20" cy="20" r="80" fill="#16a34a" />
    <circle cx="50" cy="35" r="75" fill="#22c55e" opacity="0.9" />
    <!-- Tree height label -->
    <rect x="75" y="160" width="120" height="32" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#4ade80" stroke-width="2" />
    <text x="135" y="182" fill="#4ade80" font-family="'Nunito', sans-serif" font-size="15" font-weight="900" text-anchor="middle">Tree = ? m</text>
  </g>

  <!-- Survey Pole (2 m) & 3 m Shadow -->
  <g transform="translate(180, 460)">
    <!-- Pole Shadow (3 m) -->
    <polygon points="0,0 -80,4 -80,10 0,6" fill="#022c22" opacity="0.85" />
    <!-- Pole -->
    <rect x="-4" y="-80" width="8" height="80" fill="#f59e0b" rx="2" />
    <circle cx="0" cy="-80" r="5" fill="#fef08a" />
    <!-- Red/White surveyor stripes -->
    <rect x="-3" y="-60" width="6" height="20" fill="#ef4444" />
    <rect x="-3" y="-20" width="6" height="20" fill="#ef4444" />
    <!-- Pole Labels -->
    <rect x="-105" y="-70" width="90" height="26" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="-60" y="-52" fill="#fbbf24" font-family="'Nunito', sans-serif" font-size="13" font-weight="900" text-anchor="middle">Pole = 2 m</text>
    <rect x="-85" y="15" width="90" height="24" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="#fbbf24" stroke-width="1.5" />
    <text x="-40" y="32" fill="#fbbf24" font-family="'Nunito', sans-serif" font-size="12" font-weight="800" text-anchor="middle">Shadow = 3 m</text>
  </g>

  <!-- Surveyors Maya & Leo -->
  <!-- Maya (with survey clipboard) -->
  <g transform="translate(240, 390)">
    <circle cx="20" cy="18" r="14" fill="#fed7aa" /> <!-- head -->
    <path d="M 8 16 Q 20 6 32 16 Q 34 2 20 2 Q 6 2 8 16" fill="#78350f" /> <!-- hair -->
    <rect x="10" y="32" width="20" height="34" rx="4" fill="#0284c7" /> <!-- jacket -->
    <!-- Clipboard in hand -->
    <rect x="26" y="38" width="16" height="22" rx="2" fill="#f8fafc" stroke="#475569" stroke-width="1.5" />
    <line x1="29" y1="43" x2="39" y2="43" stroke="#0284c7" stroke-width="1.5" />
    <line x1="29" y1="48" x2="39" y2="48" stroke="#0284c7" stroke-width="1.5" />
    <!-- legs -->
    <line x1="15" y1="66" x2="15" y2="76" stroke="#1e293b" stroke-width="4" />
    <line x1="25" y1="66" x2="25" y2="76" stroke="#1e293b" stroke-width="4" />
    <text x="20" y="92" fill="#bae6fd" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" text-anchor="middle">Maya</text>
  </g>

  <!-- Leo (looking puzzled with thinking bubble) -->
  <g transform="translate(290, 395)">
    <circle cx="18" cy="18" r="14" fill="#fed7aa" /> <!-- head -->
    <path d="M 6 14 Q 18 4 30 14" fill="#b45309" stroke="#b45309" stroke-width="6" stroke-linecap="round" /> <!-- curly hair -->
    <rect x="8" y="32" width="20" height="34" rx="4" fill="#ea580c" /> <!-- orange hoodie -->
    <!-- legs -->
    <line x1="13" y1="66" x2="13" y2="76" stroke="#1e293b" stroke-width="4" />
    <line x1="23" y1="66" x2="23" y2="76" stroke="#1e293b" stroke-width="4" />
    <text x="18" y="92" fill="#fed7aa" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" text-anchor="middle">Leo</text>
  </g>

  <!-- Echo the Bat (hovering above with speech bubble) -->
  <g transform="translate(270, 310)">
    <circle cx="15" cy="15" r="10" fill="#6d28d9" />
    <!-- wings -->
    <path d="M 5 15 Q -12 2 0 25 Q 5 18 5 15 Z" fill="#8b5cf6" />
    <path d="M 25 15 Q 42 2 30 25 Q 25 18 25 15 Z" fill="#8b5cf6" />
    <circle cx="12" cy="13" r="2" fill="#fef08a" />
    <circle cx="18" cy="13" r="2" fill="#fef08a" />
    <!-- speech badge -->
    <rect x="35" y="-10" width="170" height="32" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5" />
    <text x="120" y="11" fill="#f5d0fe" font-family="'Nunito', sans-serif" font-size="11" font-weight="800" text-anchor="middle">"Don't add! Compare the ratios!"</text>
  </g>
</svg>
